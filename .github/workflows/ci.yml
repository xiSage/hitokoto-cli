name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_DIR: hitokoto-cli
  ARTIFACT_NAME: hitokoto

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test
        shell: pwsh
        run: scripts/test.ps1

  build:
    name: Build (${{ matrix.rid }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: win-x86,   os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: linux-arm,   os: ubuntu-latest }
          - { rid: osx-x64,   os: macos-latest }
          - { rid: osx-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install cross-compilation toolchain (Linux ARM)
        if: runner.os == 'Linux' && startsWith(matrix.rid, 'linux-arm')
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            linux-arm64)
              sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
              for tool in ld.bfd objcopy strip; do
                sudo rm -f /usr/bin/$tool
                sudo ln -s /usr/bin/aarch64-linux-gnu-$tool /usr/bin/$tool
              done
              ;;
            linux-arm)
              sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
              for tool in ld.bfd objcopy strip; do
                sudo rm -f /usr/bin/$tool
                sudo ln -s /usr/bin/arm-linux-gnueabihf-$tool /usr/bin/$tool
              done
              ;;
          esac

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_DIR }} -r ${{ matrix.rid }}

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_DIR }}
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish/${{ matrix.rid }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x publish/${{ matrix.rid }}/${{ env.ARTIFACT_NAME }}
          tar czf ${{ env.ARTIFACT_NAME }}-${{ matrix.rid }}.tar.gz \
            -C publish/${{ matrix.rid }} ${{ env.ARTIFACT_NAME }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/${{ env.ARTIFACT_NAME }}.exe `
            -DestinationPath ${{ env.ARTIFACT_NAME }}-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ matrix.rid }}
          path: ${{ env.ARTIFACT_NAME }}-${{ matrix.rid }}.*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure
        run: ls -R artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Compute SHA256 for Homebrew formula
        id: sha
        shell: bash
        run: |
          # 版本号（去掉 tag 前缀的 v）
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

          # 计算各架构压缩包的 SHA256
          for rid in osx-x64 osx-arm64 linux-x64 linux-arm64 linux-arm; do
            file="artifacts/${{ env.ARTIFACT_NAME }}-${rid}.tar.gz"
            if [ -f "$file" ]; then
              sha=$(sha256sum "$file" | awk '{print $1}')
              echo "${rid}=${sha}" >> "$GITHUB_OUTPUT"
              echo "  ${rid}: ${sha}"
            fi
          done

      - name: Update Homebrew tap formula
        uses: xiSage/homebrew-tap/.github/actions/bump-formula@main
        with:
          formula-path: Formula/hitokoto-cli.rb
          version: ${{ steps.sha.outputs.version }}
          tag: ${{ github.ref_name }}
          osx-x64-sha: ${{ steps.sha.outputs.osx-x64 }}
          osx-arm64-sha: ${{ steps.sha.outputs.osx-arm64 }}
          linux-x64-sha: ${{ steps.sha.outputs.linux-x64 }}
          linux-arm64-sha: ${{ steps.sha.outputs.linux-arm64 }}
          linux-arm-sha: ${{ steps.sha.outputs.linux-arm }}
          committer-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
