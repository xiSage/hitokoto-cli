name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_DIR: hitokoto-cli
  ARTIFACT_NAME: hitokoto

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test
        shell: pwsh
        run: scripts/test.ps1

  build:
    name: Build (${{ matrix.rid }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest, aot-args: '' }
          - { rid: win-arm64, os: windows-latest, aot-args: '' }
          - { rid: win-x86,   os: windows-latest, aot-args: '' }
          - { rid: linux-x64,   os: ubuntu-latest, aot-args: '' }
          - { rid: linux-arm64, os: ubuntu-latest, aot-args: '' }
          - { rid: linux-arm,   os: ubuntu-latest, aot-args: '' }
          - { rid: osx-x64,   os: macos-latest, aot-args: '' }
          - { rid: osx-arm64, os: macos-latest, aot-args: '' }
          # Android (bionic libc) executables — built via the Android NDK toolchain.
          # See hitokoto-cli/BionicNativeAot.targets. arm64 covers most devices;
          # x64 covers emulators / x86 tablets.
          - { rid: linux-bionic-arm64, os: ubuntu-latest, aot-args: '-p:DisableUnsupportedError=true -p:PublishAotUsingRuntimePack=true' }
          - { rid: linux-bionic-x64,   os: ubuntu-latest, aot-args: '-p:DisableUnsupportedError=true -p:PublishAotUsingRuntimePack=true' }
          # Termux: Android binaries with RPATH pointing to
          # /data/data/com.termux/files/usr/lib so they can find
          # openssl1.1 (or other libs installed via pkg).
          - { rid: linux-bionic-arm64, os: ubuntu-latest, aot-args: '-p:DisableUnsupportedError=true -p:PublishAotUsingRuntimePack=true -p:TermuxRpath=/data/data/com.termux/files/usr/lib', display-rid: 'linux-bionic-arm64-termux' }
          - { rid: linux-bionic-x64,   os: ubuntu-latest, aot-args: '-p:DisableUnsupportedError=true -p:PublishAotUsingRuntimePack=true -p:TermuxRpath=/data/data/com.termux/files/usr/lib', display-rid: 'linux-bionic-x64-termux' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Android NDK
        if: startsWith(matrix.rid, 'linux-bionic')
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION=r27c
          curl -fsSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d "$HOME"
          NDK_ROOT="$HOME/android-ndk-${NDK_VERSION}"
          # Propagate to subsequent steps (the BionicNativeAot.targets reads $(ANDROID_NDK_ROOT)).
          echo "ANDROID_NDK_ROOT=${NDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_ROOT}" >> "$GITHUB_ENV"
          echo "Installed NDK ${NDK_VERSION} at ${NDK_ROOT}"

      - name: Install cross-compilation toolchain (Linux ARM)
        if: runner.os == 'Linux' && startsWith(matrix.rid, 'linux-arm')
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            linux-arm64)
              sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
              for tool in ld.bfd objcopy strip; do
                sudo rm -f /usr/bin/$tool
                sudo ln -s /usr/bin/aarch64-linux-gnu-$tool /usr/bin/$tool
              done
              ;;
            linux-arm)
              sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
              for tool in ld.bfd objcopy strip; do
                sudo rm -f /usr/bin/$tool
                sudo ln -s /usr/bin/arm-linux-gnueabihf-$tool /usr/bin/$tool
              done
              ;;
          esac

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_DIR }} -r ${{ matrix.rid }}

      - name: Publish
        shell: bash
        run: |
          dotnet publish ${{ env.PROJECT_DIR }} \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            ${{ matrix.aot-args }} \
            -o publish/${{ matrix.display-rid || matrix.rid }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x publish/${{ matrix.display-rid || matrix.rid }}/${{ env.ARTIFACT_NAME }}
          tar czf ${{ env.ARTIFACT_NAME }}-${{ matrix.display-rid || matrix.rid }}.tar.gz \
            -C publish/${{ matrix.display-rid || matrix.rid }} ${{ env.ARTIFACT_NAME }}

      - name: Package (Termux deb)
        if: runner.os != 'Windows' && contains(matrix.aot-args, 'TermuxRpath')
        shell: bash
        run: |
          RID="${{ matrix.display-rid || matrix.rid }}"
          # Map RID to Termux architecture name
          case "$RID" in
            *arm64*) TERMUX_ARCH=aarch64 ;;
            *x64*)   TERMUX_ARCH=x86_64 ;;
          esac
          # Read version from .csproj so it's valid on non-tag builds too
          VERSION=$(grep -oP '<Version>\K[^<]+' ${{ env.PROJECT_DIR }}/*.csproj)

          PKG_NAME="${{ env.ARTIFACT_NAME }}"
          PKG_ROOT="/tmp/${PKG_NAME}-termux-build"

          mkdir -p "${PKG_ROOT}/DEBIAN"
          mkdir -p "${PKG_ROOT}/data/data/com.termux/files/usr/bin"
          mkdir -p "${PKG_ROOT}/data/data/com.termux/files/usr/share/doc/${PKG_NAME}"

          cp "publish/${RID}/${PKG_NAME}" \
             "${PKG_ROOT}/data/data/com.termux/files/usr/bin/"
          cp LICENSE \
             "${PKG_ROOT}/data/data/com.termux/files/usr/share/doc/${PKG_NAME}/copyright"

          {
            echo "Package: ${PKG_NAME}"
            echo "Version: ${VERSION}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: ${TERMUX_ARCH}"
            echo "Maintainer: xiSage <57551864+xiSage@users.noreply.github.com>"
            echo "Homepage: https://github.com/xiSage/hitokoto-cli"
            echo "Description: Hitokoto CLI"
            echo " Fetch a random hitokoto sentence in the terminal."
          } > "${PKG_ROOT}/DEBIAN/control"

          dpkg-deb -Zgzip --build "${PKG_ROOT}" \
            "${PKG_NAME}-${RID}.deb"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.display-rid || matrix.rid }}/${{ env.ARTIFACT_NAME }}.exe `
            -DestinationPath ${{ env.ARTIFACT_NAME }}-${{ matrix.display-rid || matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ matrix.display-rid || matrix.rid }}
          path: ${{ env.ARTIFACT_NAME }}-${{ matrix.display-rid || matrix.rid }}.*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure
        run: ls -R artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Compute SHA256 for Homebrew formula
        id: sha
        shell: bash
        run: |
          # 版本号（去掉 tag 前缀的 v）
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

          # 计算各架构压缩包的 SHA256
          for rid in osx-x64 osx-arm64 linux-x64 linux-arm64 linux-arm; do
            file="artifacts/${{ env.ARTIFACT_NAME }}-${rid}.tar.gz"
            if [ -f "$file" ]; then
              sha=$(sha256sum "$file" | awk '{print $1}')
              echo "${rid}=${sha}" >> "$GITHUB_OUTPUT"
              echo "  ${rid}: ${sha}"
            fi
          done

      - name: Update Homebrew tap formula
        uses: xiSage/homebrew-tap/.github/actions/bump-formula@main
        with:
          formula-path: Formula/hitokoto-cli.rb
          tag: ${{ github.ref_name }}
          osx-x64-sha: ${{ steps.sha.outputs.osx-x64 }}
          osx-arm64-sha: ${{ steps.sha.outputs.osx-arm64 }}
          linux-x64-sha: ${{ steps.sha.outputs.linux-x64 }}
          linux-arm64-sha: ${{ steps.sha.outputs.linux-arm64 }}
          linux-arm-sha: ${{ steps.sha.outputs.linux-arm }}
          committer-token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Trigger termux-repo deployment
        shell: bash
        run: |
          curl -fsSL -X POST \
            -H "Authorization: token ${{ secrets.REPO_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/xiSage/termux-repo/dispatches \
            -d '{"event_type": "deploy-termux-debs", "client_payload": {"run_id": "${{ github.run_id }}"}}'
